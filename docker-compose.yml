services:
  api:
    build: .
    ports: ["8080:8080"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/transfer
      SPRING_DATASOURCE_USERNAME: app
      SPRING_DATASOURCE_PASSWORD: app
    depends_on: [db]
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: transfer
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
